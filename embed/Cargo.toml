[package]
name = "scalable-embed"
version = "0.1.0"
edition = "2024"
description = "Unofficial Rust library for Scalable Capital, built on a fork of Scalable CLI"
license = "Apache-2.0"
repository = "https://github.com/mlafeldt/scalable-embed"
publish = false

[dependencies]
scalable-cli = { path = ".." }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
anyhow = "1.0"
jiff = "1.0.1"
ratatui = "0.30.2"
serde_json = "1.0"
